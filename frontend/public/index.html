<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="%PUBLIC_URL%/clinic_touch.css?v=32.340" />
    <link rel="stylesheet" href="%PUBLIC_URL%/liquid_glass.css?v=32.340" />
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=32.86" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/logo192.png?v=32.86" type="image/png" sizes="192x192" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png?v=32.86" type="image/png" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="nl-version" content="32.340" />
    <meta name="theme-color" content="#121820" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#121820" />
    <style>html,body{margin:0;padding:0;background:#121820;color:#fff;color-scheme:dark;font-family:Inter,system-ui,sans-serif}#root{min-height:100vh}</style>
    <meta name="description" content="NeuroLab — Stroke Rehabilitation Research Platform" />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <meta name="mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeuroLab" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=32.86" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NeuroLab</title>
    <script>
      (function () {
        var v = document.querySelector('meta[name="nl-version"]');
        v = v && v.content;
        if (!v) return;
        var k = "nl_app_v";
        var bustKey = "nl_app_bust";
        try {
          var prev = localStorage.getItem(k);
          localStorage.setItem(k, v);
          var ua = navigator.userAgent || "";
          var isiOS = /iPad|iPhone|iPod/.test(ua)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          var standalone = navigator.standalone === true
            || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          var versionChanged = Boolean(prev && prev !== v);
          var iosNeedsBust = (isiOS || standalone) && localStorage.getItem(bustKey) !== v;
          if (!versionChanged && !iosNeedsBust) return;
          localStorage.setItem(bustKey, v);
          var go = function () {
            location.replace(
              location.pathname
              + "?_v=" + encodeURIComponent(v)
              + "&_r=" + encodeURIComponent(String(Date.now()))
              + location.hash
            );
          };
          var ready = Promise.resolve();
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              ready = ready.then(function () {
                return navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
                });
              });
            }
          } catch (e) {}
          try {
            if (window.caches && caches.keys) {
              ready = ready.then(function () {
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                });
              });
            }
          } catch (e) {}
          var t = setTimeout(go, 600);
          ready.then(function () { clearTimeout(t); go(); }, function () { clearTimeout(t); go(); });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><p style="padding:2rem;text-align:center;color:#fff9">Loading NeuroLab…</p></div>
    <script src="%PUBLIC_URL%/pwa_ipad_sync.js?v=32.340"></script>
    <script>
      (function () {
        var href = "%PUBLIC_URL%/liquid_glass.css?v=32.340";
        function pin() {
          var el = document.getElementById("nl-liquid-glass-link");
          if (!el) {
            el = document.createElement("link");
            el.id = "nl-liquid-glass-link";
            el.rel = "stylesheet";
            el.href = href;
          }
          if (el.parentNode !== document.documentElement) {
            document.documentElement.appendChild(el);
          }
        }
        function actionsDialog() {
          return document.querySelector('[role="dialog"][aria-label="Actions menu"]');
        }
        function markActionsOut() {
          var dlg = actionsDialog();
          if (dlg) dlg.classList.add("nl-actions-sheet--out");
        }
        function kinStageIndex(step, pct) {
          var text = String(step || "");
          if (/upload|send|transfer/i.test(text)) return 0;
          if (/detect|pose|hand|track|overlay|media/i.test(text)) return 1;
          if (/analy|kinem|sparc|nvp|metric|filter/i.test(text)) return 2;
          if (/done|complete|ready|finish/i.test(text)) return 3;
          var n = pct != null && !isNaN(Number(pct)) ? Number(pct) : 0;
          if (n >= 92) return 3;
          if (n >= 55) return 2;
          if (n >= 22) return 1;
          return 0;
        }
        function syncAnalyzeSteps(host, step, pct) {
          var active = kinStageIndex(step, pct);
          var chips = host.querySelectorAll(".kin-analyze-stage__step");
          for (var i = 0; i < chips.length; i += 1) {
            chips[i].classList.toggle("is-active", i === active);
            chips[i].classList.toggle("is-done", i < active);
          }
        }
        function ensureRun(host) {
          var cap = host.querySelector(".kin-analyze-stage__capsule") || host;
          var leftover = cap.querySelector(".kin-orbit, .kin-liquid-orb, .kin-run__svg");
          if (leftover && leftover.parentNode) leftover.parentNode.removeChild(leftover);
          var stale = cap.querySelector(".kin-run");
          if (stale && (stale.querySelector(".kin-run__svg") || !stale.querySelector(".kin-run__figure"))) {
            stale.parentNode.removeChild(stale);
          }
          if (cap.querySelector(".kin-run")) return;
          var html = '<div class="kin-run__stage">'
            + '<span class="kin-run__figure" style="background-image:url(\'./static/kin-run/pose-a.png\')"></span>'
            + '<span class="kin-run__ground"></span></div><div class="kin-run__pips">';
          for (var d = 0; d < 11; d += 1) html += '<span class="kin-run__pip"></span>';
          html += '</div>';
          var wrap = document.createElement("div");
          wrap.className = "kin-run";
          wrap.setAttribute("aria-hidden", "true");
          wrap.innerHTML = html;
          cap.insertBefore(wrap, cap.firstChild);
        }
        function stepperIcon(name) {
          var icons = {
            upload: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
            detect: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/></svg>',
            analyze: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>',
            done: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
          };
          return icons[name] || "";
        }
        function enhanceAnalyzeCapsule() {
          var strips = document.querySelectorAll(".kin-film-strip");
          for (var i = 0; i < strips.length; i += 1) {
            var strip = strips[i];
            var card = strip.closest("label") && strip.closest("label").parentElement;
            var panel = card ? card.querySelector(".kin-analyze-panel") : null;
            var stepEl = panel ? panel.querySelector("p") : null;
            var step = stepEl ? stepEl.textContent : "";
            var pctMatch = panel && (panel.textContent || "").match(/(\d+)\s*%/);
            var pct = pctMatch ? Number(pctMatch[1]) : null;
            var host = strip.closest(".kin-analyze-stage");
            if (host && host.getAttribute("data-nl-stadium") !== "1") {
              if (host.querySelector(".kin-analyze-stage__row") || host.querySelector(".kin-analyze-glyph-ring")) {
                var oldStrip = host.querySelector(".kin-film-strip");
                if (oldStrip && host.parentNode) {
                  host.parentNode.insertBefore(oldStrip, host);
                  host.parentNode.removeChild(host);
                  strip = oldStrip;
                }
                host = null;
              } else {
                host.setAttribute("data-nl-stadium", "1");
              }
            }
            if (!host) {
              host = document.createElement("div");
              host.className = "kin-analyze-stage";
              host.setAttribute("data-nl-stadium", "1");
              var cap = document.createElement("div");
              cap.className = "kin-analyze-stage__capsule";
              if (!strip.parentNode) continue;
              strip.parentNode.insertBefore(host, strip);
              host.appendChild(cap);
              cap.appendChild(strip);
            }
            ensureRun(host);
            if (!host.querySelector(".kin-analyze-stage__stepper")) {
              var stepper = document.createElement("div");
              stepper.className = "kin-analyze-stage__stepper";
              stepper.setAttribute("aria-label", "Analysis stages");
              var rail = document.createElement("span");
              rail.className = "kin-analyze-stage__rail";
              rail.setAttribute("aria-hidden", "true");
              stepper.appendChild(rail);
              var labels = [
                { id: "upload", label: "Upload" },
                { id: "detect", label: "Detect" },
                { id: "analyze", label: "Analyze" },
                { id: "done", label: "Done" }
              ];
              for (var j = 0; j < labels.length; j += 1) {
                var chip = document.createElement("span");
                chip.className = "kin-analyze-stage__step";
                var icon = document.createElement("span");
                icon.className = "kin-analyze-stage__icon";
                icon.innerHTML = stepperIcon(labels[j].id);
                var lab = document.createElement("span");
                lab.className = "kin-analyze-stage__label";
                lab.textContent = labels[j].label;
                chip.appendChild(icon);
                chip.appendChild(lab);
                stepper.appendChild(chip);
              }
              host.appendChild(stepper);
            }
            if (panel) panel.classList.add("nl-analyze-absorbed");
            if (step || pct != null) syncAnalyzeSteps(host, step, pct);
          }
        }
        document.addEventListener("click", function (e) {
          var dlg = actionsDialog();
          if (!dlg) return;
          if (
            e.target.closest('[aria-label="Close menu"]') ||
            e.target.closest('[role="dialog"][aria-label="Actions menu"] button') ||
            e.target.closest('[role="dialog"][aria-label="Actions menu"] a')
          ) {
            markActionsOut();
          }
        }, true);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") markActionsOut();
        }, true);
        pin();
        enhanceAnalyzeCapsule();
        if (window.MutationObserver) {
          new MutationObserver(function () {
            pin();
            enhanceAnalyzeCapsule();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </body>
</html>

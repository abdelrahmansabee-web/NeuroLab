    <title>NeuroLab</title>
    <script>
      (function () {
        var v = document.querySelector('meta[name="nl-version"]');
        v = v && v.content;
        if (!v) return;
        try {
          localStorage.setItem("nl_app_v", v);
          localStorage.setItem("nl_app_bust", v);
        } catch (e) {}
      })();
    </script>
    <script defer="defer" src="%PUBLIC_URL%/static/js/main.48f76699.js?v=32.372b"></script>
    <link href="%PUBLIC_URL%/static/css/main.2c1ebbfb.css" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><p style="padding:2rem;text-align:center;color:#fff9">Loading NeuroLab…</p></div>
    <script src="%PUBLIC_URL%/pwa_ipad_sync.js?v=32.372m"></script>
    <script>
      (function () {
        var href = "%PUBLIC_URL%/liquid_glass.css?v=32.372m";
        var cradleSrc = "/static/kin-run/cradle.gif?v=32.372m";
        try {
          var pre = new Image();
          pre.src = cradleSrc;
        } catch (e) {}
        function pin() {
          var el = document.getElementById("nl-liquid-glass-link");
          if (!el) {
            el = document.createElement("link");
            el.id = "nl-liquid-glass-link";
            el.rel = "stylesheet";
            el.href = href;
          }
          if (el.parentNode !== document.documentElement) {
            document.documentElement.appendChild(el);
          }
        }
        function actionsDialog() {
          return document.querySelector('[role="dialog"][aria-label="Actions menu"]');
        }
        function markActionsOut() {
          var d = actionsDialog();
          if (d) d.classList.add("nl-actions-sheet--out");
        }
        document.addEventListener("click", function (e) {
          var d = actionsDialog();
          if (!d) return;
          if (
            e.target.closest('[aria-label="Close menu"]')
            || e.target.closest('[role="dialog"][aria-label="Actions menu"] button')
            || e.target.closest('[role="dialog"][aria-label="Actions menu"] a')
          ) {
            markActionsOut();
          }
        }, true);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") markActionsOut();
        }, true);
        function kinStageIndex(step, pct) {
          var text = String(step || "");
          if (/upload|send|transfer/i.test(text)) return 0;
          if (/detect|pose|hand|track|overlay|media/i.test(text)) return 1;
          if (/analy|kinem|sparc|nvp|metric|filter/i.test(text)) return 2;
          if (/done|complete|ready|finish/i.test(text)) return 3;
          var n = pct != null && !isNaN(Number(pct)) ? Number(pct) : 0;
          if (n >= 92) return 3;
          if (n >= 55) return 2;
          if (n >= 22) return 1;
          return 0;
        }
        function syncAnalyzeSteps(host, step, pct) {
          var labels = ["Upload", "Detect", "Analyze", "Done"];
          var active = kinStageIndex(step, pct);
          var stepEl = host.querySelector(".nl-stage__step");
          if (stepEl) stepEl.textContent = labels[active] || "Analyze";
          var n = pct != null && !isNaN(Number(pct)) ? Math.max(0, Math.min(100, Math.round(Number(pct)))) : null;
          var num = host.querySelector(".nl-stage__pct-num");
          if (num) num.textContent = n == null ? "–" : String(n);
          var pctEl = host.querySelector(".nl-stage__pct");
          if (pctEl) pctEl.classList.toggle("is-empty", n == null);
        }
        function ensureCradle(strip) {
          var host = strip.querySelector(".nl-cradle");
          if (!host) {
            host = document.createElement("div");
            host.className = "nl-cradle";
            host.setAttribute("aria-hidden", "true");
            strip.appendChild(host);
          }
          if (!host.querySelector(".nl-cradle__gif")) {
            host.innerHTML = '<img class="nl-cradle__gif" src="' + cradleSrc + '" alt="" />';
          } else {
            var stalePct = host.querySelector(".kin-run__pct");
            if (stalePct && stalePct.parentNode) stalePct.parentNode.removeChild(stalePct);
          }
          return host;
        }
        function ensureStage(strip) {
          var old = strip.querySelector(".kin-analyze-stage__stepper");
          if (old && old.parentNode) old.parentNode.removeChild(old);
          var row = strip.querySelector(".nl-stage");
          if (row) return row;
          row = document.createElement("div");
          row.className = "nl-stage";
          row.setAttribute("aria-hidden", "true");
          row.innerHTML = '<span class="nl-stage__step">Analyze</span>'
            + '<span class="nl-stage__pct is-empty"><span class="nl-stage__pct-num">–</span></span>';
          strip.appendChild(row);
          return row;
        }
        function enhanceAnalyzeCapsule() {
          var strips = document.querySelectorAll(".kin-film-strip");
          for (var i = 0; i < strips.length; i += 1) {
            var strip = strips[i];
            if (!strip.isConnected) continue;
            strip.classList.add("nl-stadium-film");
            ensureCradle(strip);
            ensureStage(strip);
            var card = strip.closest("label") && strip.closest("label").parentElement;
            var panel = card ? card.querySelector(".kin-analyze-panel") : null;
            var stepEl = panel ? panel.querySelector("p") : null;
            var step = stepEl ? stepEl.textContent : "";
            var pctMatch = panel && (panel.textContent || "").match(/(\d+)\s*%/);
            var pct = pctMatch ? Number(pctMatch[1]) : null;
            if (panel) panel.classList.add("nl-analyze-absorbed");
            if (step || pct != null) syncAnalyzeSteps(strip, step, pct);
          }
        }
        function placeAll() {
          if (document.querySelector(".kin-film-strip")) enhanceAnalyzeCapsule();
        }
        function boot() {
          pin();
          placeAll();
        }
        boot();
        if (window.MutationObserver) {
          new MutationObserver(boot).observe(document.documentElement, { childList: true, subtree: true });
        }
        setInterval(placeAll, 320);
        window.addEventListener("scroll", placeAll, true);
        window.addEventListener("resize", placeAll);
        function clinicLock() {
          try {
            sessionStorage.setItem("neuro_kin_analyze_active", "1");
            sessionStorage.setItem("nl_clinic_file_lock", "1");
          } catch (e) {}
        }
        document.addEventListener("change", function (e) {
          var t = e.target;
          if (!t || !t.id || t.id.indexOf("kin-file-") !== 0) return;
          if (t.files && t.files[0]) clinicLock();
        }, true);
      })();
    </script>
  </body>
</html>

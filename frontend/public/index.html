<!DOCTYPE html>

  <head>
    <link rel="stylesheet" href="%PUBLIC_URL%/clinic_touch.css?v=32.323" />
    <link rel="stylesheet" href="%PUBLIC_URL%/liquid_glass.css?v=32.323" />
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=32.86" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/logo192.png?v=32.86" type="image/png" sizes="192x192" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png?v=32.86" type="image/png" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="nl-version" content="32.323" />
    <meta name="theme-color" content="#121820" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#121820" />
    <style>html,body{margin:0;padding:0;background:#121820;color:#fff;color-scheme:dark;font-family:Inter,system-ui,sans-serif}#root{min-height:100vh}</style>
    <meta name="description" content="NeuroLab — Stroke Rehabilitation Research Platform" />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <meta name="mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeuroLab" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=32.86" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NeuroLab</title>
    <script>
      (function () {
        var v = document.querySelector('meta[name="nl-version"]');
        v = v && v.content;
        if (!v) return;
        var k = "nl_app_v";
        var bustKey = "nl_app_bust";
        try {
          var prev = localStorage.getItem(k);
          localStorage.setItem(k, v);
          var ua = navigator.userAgent || "";
          var isiOS = /iPad|iPhone|iPod/.test(ua)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          var standalone = navigator.standalone === true
            || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          var versionChanged = Boolean(prev && prev !== v);
          var iosNeedsBust = (isiOS || standalone) && localStorage.getItem(bustKey) !== v;
          if (!versionChanged && !iosNeedsBust) return;
          localStorage.setItem(bustKey, v);
          var go = function () {
            location.replace(
              location.pathname
              + "?_v=" + encodeURIComponent(v)
              + "&_r=" + encodeURIComponent(String(Date.now()))
              + location.hash
            );
          };
          var ready = Promise.resolve();
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              ready = ready.then(function () {
                return navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
                });
              });
            }
          } catch (e) {}
          try {
            if (window.caches && caches.keys) {
              ready = ready.then(function () {
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                });
              });
            }
          } catch (e) {}
          var t = setTimeout(go, 600);
          ready.then(function () { clearTimeout(t); go(); }, function () { clearTimeout(t); go(); });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><p style="padding:2rem;text-align:center;color:#fff9">Loading NeuroLab…</p></div>
    <script src="%PUBLIC_URL%/pwa_ipad_sync.js?v=32.323"></script>
    <script>
      (function () {
        var href = "%PUBLIC_URL%/liquid_glass.css?v=32.323";
        function pin() {
          var el = document.getElementById("nl-liquid-glass-link");
          if (!el) {
            el = document.createElement("link");
            el.id = "nl-liquid-glass-link";
            el.rel = "stylesheet";
            el.href = href;
          }
          if (el.parentNode !== document.documentElement) {
            document.documentElement.appendChild(el);
          }
        }
        function actionsDialog() {
          return document.querySelector('[role="dialog"][aria-label="Actions menu"]');
        }
        function markActionsOut() {
          var dlg = actionsDialog();
          if (dlg) dlg.classList.add("nl-actions-sheet--out");
        }
        document.addEventListener("click", function (e) {
          var dlg = actionsDialog();
          if (!dlg) return;
          if (
            e.target.closest('[aria-label="Close menu"]') ||
            e.target.closest('[role="dialog"][aria-label="Actions menu"] button') ||
            e.target.closest('[role="dialog"][aria-label="Actions menu"] a')
          ) {
            markActionsOut();
          }
        }, true);
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") markActionsOut();
        }, true);
        pin();
        if (window.MutationObserver) {
          new MutationObserver(pin).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </body>
</html>

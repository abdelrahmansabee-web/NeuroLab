# Included from /etc/nginx/nginx.conf via conf.d/*.conf — applies to HTTP and HTTPS.
# Ubuntu already sets `gzip on;` in nginx.conf; do not repeat it here.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

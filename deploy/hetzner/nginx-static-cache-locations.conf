# Included from the clinic vhost. Hashed JS/CSS/media can be cached on every device.
location ^~ /static/js/ {
    include /etc/nginx/snippets/neurolab-static-cache.conf;
}

location ^~ /static/css/ {
    include /etc/nginx/snippets/neurolab-static-cache.conf;
}

location ^~ /static/media/ {
    include /etc/nginx/snippets/neurolab-static-cache.conf;
}

location = /bg.jpg {
    include /etc/nginx/snippets/neurolab-static-cache.conf;
}

location = /bg_baked.jpg {
    include /etc/nginx/snippets/neurolab-static-cache.conf;
}

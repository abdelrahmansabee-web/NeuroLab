# Example HTTPS vhost used on the clinic VPS.
# Cert paths are host-specific. gzip lives in nginx-gzip.conf (conf.d).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name medlabai.duckdns.org 161.97.132.60.sslip.io 161.97.132.60 _;
    client_max_body_size 512M;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://medlabai.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name medlabai.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/medlabai.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medlabai.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512M;
    client_body_timeout 300s;

    location ~ ^/(analyze|analyze-progress|auth/backup|auth/backup-file|auth/restore-file) {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering on;
        proxy_request_buffering on;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 161.97.132.60.sslip.io 161.97.132.60 _;

    ssl_certificate /etc/letsencrypt/live/161.97.132.60.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/161.97.132.60.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://medlabai.duckdns.org$request_uri;
    }
}

services:
  neurolab:
    build: .
    image: neurolab:hetzner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEUROLAB_DATA_DIR: /data/neurolab
      # Use all 4 VPS cores. Does not change Heavy pose / hands / skeleton quality.
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      OPENCV_FORCED_THREADS: "4"
      TF_NUM_INTRAOP_THREADS: "4"
      TF_NUM_INTEROP_THREADS: "1"
    volumes:
      - /var/lib/neurolab/data:/data/neurolab
    shm_size: "2gb"
    ports:
      - "127.0.0.1:7860:7860"
    stop_grace_period: 30s
